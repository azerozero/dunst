[workspace]
# Don't publish to crates.io — release via git tags only. This flag lives HERE,
# not in the crate manifests: `publish = false` in a Cargo.toml excludes the
# crate from the `cargo package --workspace` dependency overlay, which breaks
# release-plz's git-only version diffing ("no matching package named …").
publish = false
# Determine versions from git tags, not the cargo registry
git_only = true
# GitHub Release is created by the Release workflow (not release-plz)
# to avoid immutable release conflicts when uploading binaries.
git_release_enable = false
git_tag_name = "v{{ version }}"
git_tag_enable = true
changelog_update = true
# Binary-only project — no public library API to check
semver_check = false
pr_labels = ["release"]
# Only bump on feat/fix/refactor/perf commits, any scope.
# Infra changes use chore/docs/test/style/ci prefixes → automatically excluded.
# No scope allowlist needed: the prefix (feat vs chore) is the gate.
release_commits = "^(feat|fix|refactor|perf)(\\([^)]+\\))?:"

# Only the binary crate drives the release + changelog.
[[package]]
name = "dunst-mcp"
changelog_path = "CHANGELOG.md"
# The binary aggregates the four internal lib crates: include their commits in
# its changelog. NOTE: lib-only releasable commits still do NOT trigger a
# version bump (git-only mode scopes bump detection to crates/dunst-mcp);
# for a lib-only release, open a manual `chore(dunst-mcp): release vX.Y.Z`
# PR with the `release` label (see PR #43).
changelog_include = ["dunst-core", "dunst-graph", "dunst-platform", "dunst-vision"]
git_release_name = "v{{ version }}"

# Internal library crates share the workspace version but are not released
# (tagged/changelogged) individually.
[[package]]
name = "dunst-core"
release = false

[[package]]
name = "dunst-graph"
release = false

[[package]]
name = "dunst-platform"
release = false

[[package]]
name = "dunst-vision"
release = false
