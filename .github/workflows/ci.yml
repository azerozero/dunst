name: CI

on:
  merge_group:
  push:
    branches: [main]
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - "**.txt"
      - "CODEOWNERS"
      - ".vscode/**"
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke_app:
        description: "App to target for the optional live smoke job"
        required: false
        default: "Notes"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# Retry transient registry/network hiccups instead of failing the whole job.
env:
  CARGO_NET_RETRY: "10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast fail-fast lane on Linux: formatting + clippy on the pure crates give a
  # sub-2-minute signal without waiting for a macOS runner. The full workspace
  # clippy/tests still run in the `rust` job below (formatting stays there too so
  # the required "Rust checks" gate remains self-contained).
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (pure crates)
        run: cargo clippy -p dunst-core -p dunst-graph -p dunst-vision --all-targets --locked -- -D warnings

  rust:
    name: Rust checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: macos-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Doc tests
        run: cargo test --workspace --doc --locked

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Build dunst-mcp
        run: cargo build --locked -p dunst-mcp

  linux-pure:
    name: Linux pure checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: linux-pure
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test pure crates
        run: cargo test -p dunst-core -p dunst-graph -p dunst-vision --locked

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # shellcheck ships preinstalled on ubuntu-latest; no apt install needed.
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: cargo-audit@0.22.1

      - name: Audit dependencies
        run: cargo audit --deny warnings

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: cargo-deny

      - name: Check bans, licenses, advisories, sources
        run: cargo deny check

  coverage:
    name: Coverage gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Check line coverage
        # Measured line coverage is ~54% (2026-07-06); the floor only ratchets
        # up, never down. Raise it as coverage improves.
        run: cargo llvm-cov --workspace --all-targets --locked --fail-under-lines 50 --summary-only

  # Single aggregate gate: turn this into the one required status check so the
  # ruleset stops pinning individual job display-names (renaming/splitting a job
  # silently un-protects main). Fails if ANY listed gate job is not `success`.
  # NOTE: switching the required check to "CI success" is a manual ruleset step.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, rust, linux-pure, shell, security, coverage, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every gate job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Gate results: ${results}"
          for r in ${results}; do
            if [ "${r}" != "success" ]; then
              echo "::error::A gate job did not succeed (result: ${r})."
              exit 1
            fi
          done
          echo "All gate jobs succeeded."

  benchmarks:
    name: Benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Graph pipeline benchmark
        run: cargo bench -p dunst-graph --features bench --bench pipeline -- --sample-size 10

  live-smoke:
    name: Live macOS smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Run live smoke
        run: scripts/smoke-live.sh "${{ inputs.live_smoke_app || 'Notes' }}"

  # =========================================================================
  # Release chain (tag push only): extract version → build macOS binaries →
  # GitHub Release → update Homebrew tap. Mirrors the grob pattern, adapted for
  # a macOS-only binary (no Linux/cross/container).
  # =========================================================================
  version:
    name: Extract version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Read version from Cargo.toml
        id: ver
        run: |
          V=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: ${V}"

  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, rust]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BINARY_NAME: dunst-mcp
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p dunst-mcp --target ${{ matrix.target }}
      - name: Package
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          ARCHIVE="${BINARY_NAME}-${VERSION}-${{ matrix.target }}.tar.gz"
          tar czf "${ARCHIVE}" \
            -C "target/${{ matrix.target }}/release" "${BINARY_NAME}" \
            -C "${GITHUB_WORKSPACE}" README.md LICENSE
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          compression-level: 9

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create GitHub Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          {
            echo "## SHA256 Checksums"
            echo '```'
            cat ./*.sha256
            echo '```'
          } > ../CHECKSUMS.md
      - name: Validate tag matches Cargo.toml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          CARGO_VERSION="v${{ needs.version.outputs.version }}"
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" && ! "$TAG_VERSION" =~ ^${CARGO_VERSION}- ]]; then
            echo "::error::Tag $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --notes-file CHECKSUMS.md \
            $PRERELEASE \
            artifacts/*.tar.gz artifacts/*.sha256

  homebrew:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          V="${VERSION#v}"

          # Hash the macOS tarballs from the GitHub Release (this job runs after
          # the release job, so the assets exist).
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            URL="https://github.com/azerozero/dunst/releases/download/${VERSION}/dunst-mcp-${VERSION}-${TARGET}.tar.gz"
            SHA=$(curl -sSL "$URL" | sha256sum | cut -d' ' -f1)
            eval "SHA_${TARGET//-/_}=$SHA"
          done

          # macOS-only formula (dunst-mcp uses macOS Accessibility / CoreGraphics).
          cat > /tmp/dunst-mcp.rb << RUBY
          class DunstMcp < Formula
            desc "macOS GUI automation MCP server (Accessibility, OCR, vision)"
            homepage "https://github.com/azerozero/dunst"
            version "${V}"
            license "Apache-2.0"
            depends_on :macos

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/azerozero/dunst/releases/download/v#{version}/dunst-mcp-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_aarch64_apple_darwin}"
              else
                url "https://github.com/azerozero/dunst/releases/download/v#{version}/dunst-mcp-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_x86_64_apple_darwin}"
              end
            end

            def install
              bin.install "dunst-mcp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dunst-mcp --version")
            end
          end
          RUBY

          # Strip the heredoc indentation.
          sed -i 's/^          //' /tmp/dunst-mcp.rb

          # Clone the tap, update the formula, push.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/azerozero/homebrew-tap.git" /tmp/tap
          cp /tmp/dunst-mcp.rb /tmp/tap/Formula/dunst-mcp.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dunst-mcp.rb
          git commit -m "dunst-mcp ${V}"
          git push

  homebrew-test:
    name: Test Homebrew install
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, homebrew]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Install via brew
        run: |
          brew install azerozero/tap/dunst-mcp
          dunst-mcp --version
