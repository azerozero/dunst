name: "Semgrep SAST"

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/semgrep.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/semgrep.yml"
  schedule:
    # Weekly scan (Wednesdays 06:00 UTC)
    - cron: "0 6 * * 3"

permissions:
  security-events: write
  contents: read

jobs:
  semgrep:
    name: Semgrep Rust SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.144.0

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # `--config` takes precedence over the SEMGREP_RULES env var, so the
      # rulesets must be passed explicitly here or they are silently ignored.
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/rust
          --config p/secrets
          --config p/owasp-top-ten
          --sarif --output semgrep-results.sarif
          crates/

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
