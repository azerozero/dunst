fail_fast = true
default_install_hook_types = ["pre-commit", "pre-push"]

# Builtin fast hooks: Rust-native, no network, no environment bootstrap.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix", "lf"] },
]

[[repos]]
repo = "local"

# Secret scan staged changes before they enter history.
[[repos.hooks]]
id = "gitleaks"
name = "gitleaks"
language = "system"
entry = "gitleaks protect --staged --no-banner"
pass_filenames = false

# Rust edit loop.
[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all --"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
types = ["rust"]
pass_filenames = false

# Shell wrappers are part of the MCP entrypoint surface.
[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "sh"
args = ["-c", "shellcheck scripts/*.sh"]
types = ["shell"]
pass_filenames = false

# Grob-style local docs gate: offline links before CI checks Markdown shape and
# online links.
[[repos.hooks]]
id = "lychee-offline"
name = "lychee (offline link check)"
language = "system"
entry = "sh"
args = ["-c", "lychee --offline --no-progress --include-fragments docs/**/*.md README.md"]
types = ["markdown"]
pass_filenames = false

# Heavier checks run on push. cargo-test is intentionally NOT here: CI re-runs the
# full suite on macOS + Linux for every PR, so duplicating ~minutes of work locally
# only delays the developer feedback loop. Keep the push gate fast-fail.

# License, advisory and dependency policy.
[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny"
language = "system"
entry = "cargo deny check"
types_or = ["rust", "toml"]
pass_filenames = false
stages = ["pre-push"]

# Doc coverage: no undocumented public items (see CLAUDE.md doc standards).
[[repos.hooks]]
id = "cargo-doc-coverage"
name = "cargo doc coverage"
language = "system"
entry = "sh"
args = ["-c", "RUSTDOCFLAGS='-W missing-docs' cargo doc --workspace --no-deps 2>&1 | grep -q 'warning: missing documentation' && { echo 'ERROR: undocumented public items found'; RUSTDOCFLAGS='-W missing-docs' cargo doc --workspace --no-deps 2>&1 | grep 'warning: missing documentation' | head -20; exit 1; } || true"]
types = ["rust"]
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-audit"
name = "cargo audit"
language = "system"
entry = "cargo audit"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-machete"
name = "cargo machete"
language = "system"
entry = "cargo machete"
always_run = true
pass_filenames = false
stages = ["pre-push"]

# Sweep stale build artifacts (>7 days) to keep target/ from bloating.
[[repos.hooks]]
id = "cargo-sweep"
name = "cargo sweep (clean old artifacts)"
language = "system"
entry = "cargo sweep --time 7"
always_run = true
pass_filenames = false
stages = ["pre-push"]
